name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  base-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for high-confidence secrets
        run: node scripts/ci/scan-tracked-secrets.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Dependabot automation policy
        run: node --test scripts/ci/dependabot-policy.test.mjs

      - name: Validate build lane boundaries
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/validate-build-lane.mjs

      - name: Validate build contract
        if: github.event_name == 'pull_request'
        run: node scripts/ci/validate-build-contract.mjs

      - name: Enforce active lane limit
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/validate-active-lanes.mjs

      - name: Enforce declared dependencies
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/validate-pr-dependencies.mjs

      - name: Validate integration queue policy
        run: node --check scripts/ci/integration-queue.mjs

      - name: Validate Integration Wave V2 policy
        run: node --check scripts/ci/integration-wave-v2.mjs

      - name: Validate Portal release-readiness contract
        run: node scripts/ci/validate-portal-release-readiness.mjs .gmvgang/portal-release-readiness.json

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Dependency security audit
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  security-invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gmvgang_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gmvgang_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gmvgang_security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Authorization regression tests
        run: |
          pnpm --filter @gmvgang/platform-server exec vitest run test/auth.test.ts
          pnpm --filter @gmvgang/platform-api exec vitest run \
            test/membership-http.test.ts \
            test/creator-workspace-http.test.ts \
            test/brand-overview.test.ts

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Bootstrap isolated Supabase-compatible database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/ci_bootstrap.sql

      - name: Apply all Supabase migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "::group::Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
            echo "::endgroup::"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Verify platform foundation security
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/verify/platform_foundation.sql

      - name: Verify append-only audit hardening
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/verify/platform_audit_hardening.sql

      - name: Verify RLS and cross-tenant isolation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/verify/security_invariants.sql

  quality:
    if: ${{ always() }}
    needs:
      - base-quality
      - security-invariants
    runs-on: ubuntu-latest
    steps:
      - name: Require base quality and security invariants
        env:
          BASE_QUALITY_RESULT: ${{ needs.base-quality.result }}
          SECURITY_INVARIANTS_RESULT: ${{ needs.security-invariants.result }}
        run: |
          echo "base-quality=${BASE_QUALITY_RESULT}"
          echo "security-invariants=${SECURITY_INVARIANTS_RESULT}"
          test "${BASE_QUALITY_RESULT}" = "success"
          test "${SECURITY_INVARIANTS_RESULT}" = "success"
