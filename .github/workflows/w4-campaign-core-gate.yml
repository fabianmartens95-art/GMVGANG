# Fail-closed W4 exit gate. This workflow never promotes Production.
name: W4 Campaign Core Gate

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact current main revision to verify
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: w4-campaign-core-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      GATE_REVISION: ${{ inputs.revision }}
      W4_AUTONOMOUS_CONFIG: .gmvgang/w4-autonomous-execution.json
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate gate engine syntax
        run: node --check scripts/ci/w4-campaign-core-gate.mjs

      - name: Verify W4 evidence and prepare auto-advance
        run: node scripts/ci/w4-campaign-core-gate.mjs
