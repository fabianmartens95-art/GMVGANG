name: Staging Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-staging:
    name: Verify deployed staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run quality gate
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Validate staging target
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          PRIMARY_BASE_URL: ${{ secrets.PRIMARY_BASE_URL }}
        run: node scripts/validate-staging-target.mjs

      - name: Verify exact deployed revision
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/verify-staging-revision.mjs

      - name: Run remote smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: node scripts/smoke-platform.mjs

      - name: Record production gate summary
        run: |
          {
            echo "## GMVGANG staging verification"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Quality gate: typecheck + test + build"
            echo "- Deployed revision: exact commit match"
            echo "- Remote smoke: passed"
            echo "- Promotion: manual only after this gate"
          } >> "$GITHUB_STEP_SUMMARY"
