name: One-shot R2 category type patch

on:
  push:
    branches:
      - p0/native-creator-qualification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/native-creator-qualification
          fetch-depth: 0
      - name: Apply targeted patch and remove workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/platform-portal/src/creator-qualification.ts')
          text = path.read_text()
          old = 'checked(q?.contentCategories, value)'
          new = 'checked(q?.contentCategories, value ?? "")'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-r2-category-type.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-portal/src/creator-qualification.ts .github/workflows/patch-r2-category-type.yml
          git commit -m "fix(platform-portal): satisfy category tuple typing"
          git push origin HEAD:p0/native-creator-qualification
