name: Safe Auto Merge

on:
  workflow_run:
    workflows: ["CI", "Parallel Build Guard"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  evaluate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    concurrency:
      group: safe-auto-merge-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Evaluate safe auto-merge
        id: eligibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HIGH_VELOCITY_POLICY: .gmvgang/high-velocity-mode.json
        run: node scripts/ci/safe-auto-merge.mjs

      - name: Squash merge eligible PR
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --squash --delete-branch
